<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Λ∀ʌ†ʌʀ ∆ʀ†s – Steven Chaplinski</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #0d0f12;
      --card-bg: #161b22;
      --card-border: #21262d;
      --accent: #67e8f9;
      --accent-glow: rgba(103, 232, 249, 0.15);
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --tag-bg: #1f2937;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      padding: 0 1.5rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      text-align: center;
      padding: 5rem 1rem 3rem;
      max-width: 800px;
      margin: 0 auto;
    }

    h1 {
      font-size: 3rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.75rem;
      background: linear-gradient(135deg, #ffffff 0%, #67e8f9 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.tagline {
      font-size: 1.2rem;
      color: var(--text-muted);
    }

    main { flex: 1; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1.5rem;
      max-width: 1100px;
      margin: 0 auto 4rem;
    }

    .card {
      background: var(--card-bg);
      padding: 1.75rem;
      border-radius: 12px;
      border: 1px solid var(--card-border);
      transition: all 0.25s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
      box-shadow: 0 8px 24px var(--accent-glow);
    }

    .card h2 {
      font-size: 1.35rem;
      margin-bottom: 0.75rem;
      color: var(--accent);
    }

    .card p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 1.25rem;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: auto;
    }

    .tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      background-color: var(--tag-bg);
      color: var(--accent);
      padding: 0.25rem 0.5rem;
      border-radius: 6px;
      border: 1px solid rgba(103, 232, 249, 0.2);
    }

    .contact {
      text-align: center;
      max-width: 600px;
      margin: 2rem auto 4rem;
      padding: 2.5rem;
      background: rgba(22, 27, 34, 0.5);
      border-radius: 16px;
      border: 1px solid var(--card-border);
    }

    .contact a {
      color: var(--accent);
      text-decoration: none;
      font-family: 'JetBrains Mono', monospace;
    }

    footer {
      padding: 2rem 0;
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-muted);
      border-top: 1px solid var(--card-border);
    }
  </style>
</head>
<body>

  <header>
    <h1>Λ∀ʌ†ʌʀ ∆ʀ†s</h1>
    <p class="tagline">Creative Automation, AI Workflows &amp; System Architecture by Steven Chaplinski</p>
  </header>

  <main>
    <section class="grid" id="projects-container">
      <!-- Projects will load dynamically here -->
    </section>

    <section class="contact">
      <h2 style="margin-bottom:1rem;">Get In Touch</h2>
      <p>Email: <a href="mailto:contact@avatararts.org">contact@avatararts.org</a></p>
      <p style="margin-top: 0.75rem;">Project Form: <a href="https://tally.so/r/xyz123" target="_blank">Inquiry Form &rarr;</a></p>
    </section>
  </main>

  <footer>
    &copy; 2026 Steven Chaplinski &bull; <a href="https://github.com/AvaTar-ArTs" style="color:inherit;">github.com/AvaTar-ArTs</a>
  </footer>

  <script>
    async function loadProjects() {
      const container = document.getElementById('projects-container');
      
      try {
        // Try fetching custom projects.json
        const res = await fetch('./projects.json');
        if (!res.ok) throw new Error('Local feed unavailable');
        const projects = await res.json();
        renderProjects(projects);
      } catch (e) {
        console.warn('Fallback to GitHub API:', e);
        // Fallback: Fetch public repos directly from GitHub API
        try {
          const apiRes = await fetch('https://api.github.com/users/AvaTar-ArTs/repos?sort=updated&per_page=6');
          const repos = await apiRes.json();
          const mappedProjects = repos.map(repo => ({
            title: repo.name,
            description: repo.description || 'Creative automation repository.',
            tags: [repo.language || 'Python', 'GitHub']
          }));
          renderProjects(mappedProjects);
        } catch (err) {
          container.innerHTML = '<p style="text-align:center; grid-column: 1/-1;">Unable to load projects right now.</p>';
        }
      }
    }

    function renderProjects(projects) {
      const container = document.getElementById('projects-container');
      container.innerHTML = projects.map(p => `
        <article class="card">
          <div>
            <h2>${p.title}</h2>
            <p>${p.description}</p>
          </div>
          <div class="tags">
            ${p.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
          </div>
        </article>
      `).join('');
    }

    loadProjects();
  </script>

</body>
</html>
